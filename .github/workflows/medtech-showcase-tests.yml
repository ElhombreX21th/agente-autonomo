name: MedTech showcase unit tests
on:
  push:
    paths:
      - 'upwork_showcase_2026/**'
      - '.github/workflows/medtech-showcase-tests.yml'
  pull_request:
    paths:
      - 'upwork_showcase_2026/**'
      - '.github/workflows/medtech-showcase-tests.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 17 deterministic offline tests
        run: python -m unittest discover -s upwork_showcase_2026/tests -v
