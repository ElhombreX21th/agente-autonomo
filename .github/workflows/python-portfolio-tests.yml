name: Python Portfolio Lab Tests

on:
  push:
    paths:
      - 'portfolio_lab/**'
      - 'tests/test_portfolio_lab.py'
      - '.github/workflows/python-portfolio-tests.yml'
  pull_request:
    paths:
      - 'portfolio_lab/**'
      - 'tests/test_portfolio_lab.py'

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all portfolio regression tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic-data demos
        run: python -m portfolio_lab.demo
