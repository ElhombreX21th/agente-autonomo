services:
  agent:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      AGENT_AUTH_REQUIRED: "1"
      AGENT_DATABASE: /data/tasks.sqlite3
    volumes:
      - agent-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  agent-data:
