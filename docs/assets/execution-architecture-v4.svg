<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Implemented local execution</title><desc id="desc">A validated request selects an allowlisted deterministic tool. Unapproved requests return previews. Approved requests execute locally and return JSON plus transient audit events. Persistence, AI and authentication are planned.</desc><rect width="1000" height="560" rx="20" fill="#080e1d"/><g font-family="Arial,sans-serif"><text x="40" y="52" fill="#67e8f9" font-size="13" letter-spacing="3">EXECUTION / CURRENT IMPLEMENTATION</text><text x="40" y="92" fill="#f1f5f9" font-size="28" font-weight="bold">An explicit gate before every local action.</text><rect x="40" y="135" width="270" height="90" rx="12" fill="#111c30" stroke="#334766"/><text x="58" y="167" fill="#a5b4fc" font-size="14" font-weight="bold">01 / VALIDATE</text><text x="58" y="197" fill="#cbd5e1" font-size="12">Nonempty task · max 5,000 characters</text><rect x="365" y="135" width="270" height="90" rx="12" fill="#111c30" stroke="#334766"/><text x="383" y="167" fill="#a5b4fc" font-size="14" font-weight="bold">02 / SELECT</text><text x="383" y="197" fill="#cbd5e1" font-size="12">checklist · classify · summarize</text><rect x="690" y="135" width="270" height="90" rx="12" fill="#111c30" stroke="#334766"/><text x="708" y="167" fill="#a5b4fc" font-size="14" font-weight="bold">03 / APPROVAL</text><text x="708" y="197" fill="#cbd5e1" font-size="12">Caller supplies approved=True</text><rect x="365" y="295" width="270" height="95" rx="12" fill="#111c30" stroke="#334766"/><text x="383" y="327" fill="#a5b4fc" font-size="14" font-weight="bold">PREVIEW / DEFAULT</text><text x="383" y="357" fill="#cbd5e1" font-size="12">Return approval_required + preview</text><rect x="690" y="295" width="270" height="95" rx="12" fill="#111c30" stroke="#334766"/><text x="708" y="327" fill="#a5b4fc" font-size="14" font-weight="bold">EXECUTE / APPROVED</text><text x="708" y="357" fill="#cbd5e1" font-size="12">Deterministic local Python function</text><g stroke="#67e8f9" stroke-width="2" fill="none"><path d="M310 180H365m-9-5 9 5-9 5M635 180H690m-9-5 9 5-9 5M825 225V295m-5-9 5 9 5-9M780 225V260H500V295m-5-9 5 9 5-9M500 390V425H825V390"/></g><rect x="40" y="450" width="920" height="72" rx="12" fill="#102329" stroke="#245563"/><text x="60" y="478" fill="#67e8f9" font-size="15" font-weight="bold">RESULT / JSON + TASK ID + TIMESTAMPED EVENTS</text><text x="60" y="502" fill="#cbd5e1" font-size="13">Audit lives in the returned object. No database, LLM, external actions or authenticated approval.</text></g></svg>