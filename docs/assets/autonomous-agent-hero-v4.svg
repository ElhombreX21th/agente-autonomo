ll="#F5F8FF" letter-spacing="-2">Workflows,</text><text x="67" y="310" font-family="Arial,sans-serif" font-size="66" font-weight="bold" fill="url(#a)" letter-spacing="-2">under control.</text><text x="70" y="356" font-family="Arial,sans-serif" font-size="20" fill="#9FB0CD">A Python-first foundation for auditable task automation.</text><g transform="translate(970 94)"><rect x="0" y="0" width="352" height="251" rx="17" fill="#101B30" stroke="#354566"/><rect x="0" y="0" width="352" height="39" rx="17" fill="#18253C"/><path d="M0 39H352" stroke="#354566"/><circle cx="22" cy="19" r="5" fill="#FB7185"/><circle cx="40" cy="19" r="5" fill="#FBBF24"/><circle cx="58" cy="19" r="5" fill="#34D399"/><text x="80" y="24" fill="#A8B8D2" font-family="monospace" font-size="12">workflow / preview</text><rect x="23" y="61" width="305" height="43" rx="9" fill="#172841" stroke="#2A4362"/><circle cx="45" cy="83" r="8" fill="#2DD4BF"/><text x="65" y="88" font-family="Arial" font-size="15" fill="#E2E8F0">Task received</text><path d="M45 104V125" stroke="#5B7396" stroke-width="2"/><rect x="23" y="125" width="305" height="43" rx="9" fill="#172841" stroke="#2A4362"/><circle cx="45" cy="147" r="8" fill="#818CF8"/><text x="65" y="152" font-family="Arial" font-size="15" fill="#E2E8F0">Approval gate</text><path d="M45 168V188" stroke="#5B7396" stroke-width="2"/><rect x="23" y="188" width="305" height="43" rx="9" fill="#172841" stroke="#2A4362"/><circle cx="45" cy="210" r="8" fill="#2DD4BF"/><text x="65" y="215" font-family="Arial" font-size="15" fill="#E2E8F0">Structured output + audit</text></g></svg>